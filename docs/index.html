<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JPEQ Map</title>
  <meta name="description" content="Official JMA seismic intensity by station, on GSI's pale map.">
  <meta name="theme-color" content="#0e1116">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JPEQ Map">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css?v=1">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">JPEQ <span>Map</span></div>
      <div class="status"><span class="dot" id="dot"></span><span id="status">読み込み中…</span></div>
    </header>

    <section class="map-wrap">
      <div id="map" aria-label="震度分布図"></div>
      <div class="legend" aria-label="震度の色">
        <span class="i i1">1</span><span class="i i2">2</span><span class="i i3">3</span><span class="i i4">4</span><span class="i i5m">5弱</span><span class="i i5p">5強</span><span class="i i6m">6弱</span><span class="i i6p">6強</span><span class="i i7">7</span>
      </div>
      <div class="toast" id="toast" hidden></div>
    </section>

    <section class="card" id="card" aria-live="polite">
      <div class="card-main">
        <div class="maxint" id="cMax">-</div>
        <div class="card-text">
          <div class="c-title" id="cTitle">—</div>
          <div class="c-region" id="cRegion">—</div>
          <div class="c-meta" id="cMeta">—</div>
        </div>
      </div>
      <div class="c-comment" id="cComment"></div>
      <div class="c-note" id="cNote"></div>
    </section>

    <section class="list-wrap">
      <div class="list-head">最近の地震</div>
      <ul class="list" id="list"></ul>
    </section>

    <footer class="credit">
      出典：<a href="https://www.jma.go.jp/bosai/map.html#contents=earthquake_map" target="_blank" rel="noopener">気象庁ホームページ（地震情報）</a>をもとにJPEQ Mapが作成。
      地図：<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル</a>（淡色地図）に震央・震度観測点を追記して掲載。<br>
      JPEQ Map is an unofficial personal project, not affiliated with JMA or GSI. 最新・正確な情報は<a href="https://www.jma.go.jp/bosai/map.html#contents=earthquake_map" target="_blank" rel="noopener">気象庁</a>で確認してください。
      <span id="ver"></span>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="config.js?v=1"></script>
  <script src="app.js?v=1"></script>
</body>
</html>
